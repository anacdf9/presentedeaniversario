<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERRO 1244</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div>
    <div class="content">
        <h1 class="error-title">ERRO 1244</h1>
        <h2 class="subtitle">A programação ainda não acabou, aguarde...</h2>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
        <p class="press-enter">Pressione <strong>Enter</strong> para continuar...</p>

    <script>
        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                window.location.href = "hackeado.html";
            }
        });
    </script>
